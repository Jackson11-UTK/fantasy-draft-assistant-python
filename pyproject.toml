[project]
name = "fantasy-draft-assistant"
version = "0.1.0"
description = "2026 fantasy football draft assistant for Karns FFL and Mo Better League"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "nflreadpy>=0.1.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.43.2",
    "python-dotenv>=1.2.3",
    "requests>=2.32",
    "scipy>=1.13",
    "streamlit>=1.40",
]

[tool.uv]
package = false
